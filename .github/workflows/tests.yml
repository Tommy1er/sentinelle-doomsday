name: Tests unitaires hors réseau

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Check Google Apps Script syntax and JSON parsing fixtures
        run: |
          node --check < tools/google_apps_script_value_audit.gs
          node - <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const context = { console };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('tools/google_apps_script_value_audit.gs', 'utf8'), context);
          if (context.testPatheValueInspectorFixture() !== true) {
            process.exit(1);
          }
          JS

      - name: Validate cinema-scoped sentinel and Telegram setup (offline)
        run: |
          node --check < tools/google_apps_script_sentinel.gs
          node --check < tools/google_apps_script_telegram_setup.gs
          node - <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const context = { console };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('tools/google_apps_script_sentinel.gs', 'utf8'), context);
          if (context.testSentinelleParserFixture() !== true) {
            process.exit(1);
          }
          JS

      - name: Offline end-to-end Apps Script alert tests
        run: node tests/test_google_apps_script_sentinel.js

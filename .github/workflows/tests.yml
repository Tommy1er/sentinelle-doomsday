name: Tests unitaires hors réseau

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Check Google Apps Script syntax and JSON parsing fixtures
        run: |
          node --check < tools/google_apps_script_value_audit.gs
          node - <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const context = { console };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('tools/google_apps_script_value_audit.gs', 'utf8'), context);
          if (context.testPatheValueInspectorFixture() !== true) {
            process.exit(1);
          }
          JS

      - name: Validate cinema-scoped sentinel and Telegram setup (offline)
        run: |
          node --check < tools/google_apps_script_sentinel.gs
          node --check < tools/google_apps_script_telegram_setup.gs
          node - <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const context = { console };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('tools/google_apps_script_sentinel.gs', 'utf8'), context);
          if (context.testSentinelleParserFixture() !== true) {
            process.exit(1);
          }
          JS

      - name: Offline end-to-end Apps Script alert tests
        run: node tests/test_google_apps_script_sentinel.js

      - name: Sentinel adversarial reliability fixtures
        run: node tests/test_google_apps_script_resilience.js

      - name: Multi-film Pathé cohort audit fixtures (offline)
        run: |
          node --check < tools/google_apps_script_film_cohort_audit.gs
          node - <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const scope = { console };
          vm.createContext(scope);
          vm.runInContext(fs.readFileSync('tools/google_apps_script_film_cohort_audit.gs','utf8'),scope);
          if (scope.testPatheCohortAuditFixture() !== true) process.exit(1);
          JS

      - name: Real-schema detailed showtime sale-window signals (offline)
        run: node tests/test_google_apps_script_showtime_signal.js

      - name: Integrated detailed booking monitor (offline)
        run: |
          node --check < tools/google_apps_script_booking_monitor.gs
          node tests/test_google_apps_script_booking_monitor.js

      - name: Persistent core and detail outage reminders (offline)
        run: node tests/test_google_apps_script_failure_reminders.js

      - name: External watchdog acknowledgement and health policy (offline)
        run: node tests/test_google_apps_script_watchdog.js

      - name: Bounded pilot instrumentation and audit syntax (offline)
        run: |
          node --check < tools/google_apps_script_imax_audit.gs
          node --check < tools/google_apps_script_pilot_metrics.gs
          node tests/test_google_apps_script_pilot_metrics.js

      - name: IMAX day-tag bias and detailed-room fallback (offline)
        run: node tests/test_google_apps_script_imax_audit.js

      - name: Telegram test receipt binding (offline)
        run: |
          node --check < tools/google_apps_script_telegram_receipt.gs
          node tests/test_google_apps_script_telegram_receipt.js

      - name: Fixed pilot window boundary (offline)
        run: node tests/test_google_apps_script_pilot_window.js

      - name: Read-only 8- vs 20-date runtime benchmark fixtures
        run: |
          node --check < tools/google_apps_script_quota_benchmark.gs
          node tests/test_google_apps_script_quota_benchmark.js

      - name: Gated permanent watcher entrypoint (offline)
        run: |
          node --check < tools/google_apps_script_production.gs
          node tests/test_google_apps_script_production.js

      - name: Deployment evidence, code fingerprint and end-of-service closeout (offline)
        run: |
          node --check < tools/google_apps_script_deploy_check.gs
          node tests/test_google_apps_script_deploy_check.js
          echo "Expected Apps Script code fingerprint: $(node tools/compute_code_fingerprint.js)"
